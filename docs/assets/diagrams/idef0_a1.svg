  <text x="175.0" y="176" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Ingest Comment Stream</text>
  <text x="112" y="188" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">• Read 500k/day posts</text>
  <text x="112" y="200" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">• Tokenize & validate</text>
  <text x="112" y="212" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">• Push to Kafka topic</text>

  <rect x="330" y="260" width="170" height="90" rx="6" fill="#0f172a" />
