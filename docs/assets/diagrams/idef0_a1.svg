  <text x="415.0" y="296" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Classify Comment ML</text>
  <text x="342" y="308" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">• Fine-tuned RuBERT</text>
