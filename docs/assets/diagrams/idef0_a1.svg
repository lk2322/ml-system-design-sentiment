<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#020617" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">IDEF0 A1: ML-Powered Content Moderation Functional Decomposition</text>
  <text x="30" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Inputs (L), Controls (T), Mechanisms (B), Outputs (R)</text>
  <text x="500" y="30" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">CONTROLS: RKN Rules, Internal SLA (<200ms), FZ-152, CPU/GPU Budget</text>
  <text x="500" y="650" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">MECHANISMS: RuBERT (DeepPavlov), Triton Inference Server, Human Moderators, K8s Auto-scalers</text>

  <rect x="100" y="140" width="150" height="80" rx="6" fill="#0f172a" />
  <rect x="100" y="140" width="150" height="80" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5" />
