  <rect x="800" y="500" width="170" height="80" rx="6" fill="#0f172a" />
  <rect x="800" y="500" width="170" height="80" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5" />
