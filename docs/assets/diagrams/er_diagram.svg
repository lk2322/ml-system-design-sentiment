<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#020617" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">Relational and Analytical Data Schema (Hybrid OLTP/OLAP)</text>
  <text x="30" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Primary storage (PostgreSQL, sharded) & Cold Analytics (ClickHouse)</text>

  <rect x="50" y="120" width="220" height="150" rx="6" fill="#0f172a" />
  <rect x="50" y="120" width="220" height="150" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5" />
  <text x="160.0" y="142" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">users (PostgreSQL Sharded)</text>
  <text x="160.0" y="156" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Primary key: id</text>
  <text x="62" y="168" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">id: VARCHAR(36) [PK]</text>
  <text x="62" y="180" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">username: VARCHAR(64) [UNIQUE]</text>
  <text x="62" y="192" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">reputation: FLOAT [DEFAULT 1.0]</text>
  <text x="62" y="204" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">registration_date: TIMESTAMP</text>
  <text x="62" y="216" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">status: VARCHAR(20) [active/banned]</text>
  <text x="62" y="228" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">platform_id: VARCHAR(36)</text>

  <rect x="380" y="120" width="240" height="170" rx="6" fill="#0f172a" />
  <rect x="380" y="120" width="240" height="170" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5" />
  <text x="500.0" y="142" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">comments (PostgreSQL Sharded)</text>
  <text x="500.0" y="156" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Shard Key: user_id</text>
  <text x="392" y="168" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">id: VARCHAR(36) [PK]</text>
  <text x="392" y="180" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">user_id: VARCHAR(36) [FK -> users.id]</text>
  <text x="392" y="192" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">content: TEXT [UTF-8, Unmasked]</text>
  <text x="392" y="204" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">created_at: TIMESTAMP [INDEX]</text>
  <text x="392" y="216" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">post_id: VARCHAR(36)</text>
  <text x="392" y="228" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">platform_id: VARCHAR(36)</text>
  <text x="392" y="240" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">status: VARCHAR(20) [approved/hidden]</text>

  <rect x="720" y="120" width="240" height="160" rx="6" fill="#0f172a" />
  <rect x="720" y="120" width="240" height="160" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5" />
  <text x="840.0" y="142" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">ml_sentiment_results</text>
  <text x="840.0" y="156" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">FK: comment_id</text>
  <text x="732" y="168" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">id: VARCHAR(36) [PK]</text>
  <text x="732" y="180" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">comment_id: VARCHAR(36) [FK -> comments.id]</text>
  <text x="732" y="192" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">toxicity_score: FLOAT</text>
  <text x="732" y="204" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">label: VARCHAR(16) [toxic/threat/neutral]</text>
  <text x="732" y="216" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">confidence: FLOAT</text>
  <text x="732" y="228" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">processed_at: TIMESTAMP</text>
  <text x="732" y="240" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">model_version: VARCHAR(32)</text>

  <rect x="200" y="380" width="260" height="160" rx="6" fill="#0f172a" />
  <rect x="200" y="380" width="260" height="160" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5" />
  <text x="330.0" y="402" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">moderation_actions</text>
  <text x="330.0" y="416" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">History Logs</text>
  <text x="212" y="428" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">id: VARCHAR(36) [PK]</text>
  <text x="212" y="440" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">comment_id: VARCHAR(36) [FK -> comments.id]</text>
  <text x="212" y="452" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">action_type: VARCHAR(24) [auto_hide/manual]</text>
  <text x="212" y="464" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">reason: VARCHAR(128)</text>
  <text x="212" y="476" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">moderator_id: VARCHAR(36) [NULL for AI]</text>
  <text x="212" y="488" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">executed_at: TIMESTAMP [INDEX]</text>

  <rect x="580" y="380" width="280" height="180" rx="6" fill="#0f172a" />
  <rect x="580" y="380" width="280" height="180" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5" />
  <text x="720.0" y="402" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">moderation_analytics (ClickHouse)</text>
  <text x="720.0" y="416" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Engine: MergeTree ORDER BY date</text>
  <text x="592" y="428" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">date: Date [PARTITION KEY]</text>
  <text x="592" y="440" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">comment_id: String</text>
  <text x="592" y="452" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">user_id: String</text>
  <text x="592" y="464" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">toxicity_score: Float32</text>
  <text x="592" y="476" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">sentiment_label: LowCardinality(String)</text>
  <text x="592" y="488" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">action_type: LowCardinality(String)</text>
  <text x="592" y="500" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">processing_latency_ms: UInt32</text>
  <text x="592" y="512" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">platform_id: String</text>
  <text x="592" y="524" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">timestamp: DateTime</text>
  <!-- Users -> Comments -->
  <path d="M 270 195 L 380 195" stroke="#22d3ee" stroke-width="1.5" />
  <text x="280" y="190" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="start">1</text>
  <text x="365" y="190" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="start">0..*</text>
  <!-- Comments -> ML Results -->
  <path d="M 620 200 L 720 200" stroke="#34d399" stroke-width="1.5" />
  <text x="628" y="195" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="start">1</text>
  <text x="705" y="195" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="start">1</text>
  <!-- Comments -> Moderation Actions -->
  <path d="M 440 290 L 440 330 L 330 330 L 330 380" fill="none" stroke="#fbbf24" stroke-width="1.5" />
  <text x="445" y="305" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="start">1</text>
  <text x="315" y="375" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="start">0..*</text>
  <!-- ETL to ClickHouse -->
  <path d="M 500 290 L 500 350 L 720 350 L 720 380" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="540" y="345" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="start">ETL / Kafka Engine</text>

</svg>